services:
  - type: web
    name: cr-garments-backend
    env: python
    rootDir: CR-GARMENTS/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
